<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8eef4" />
  <title>Map · three pages</title>
  <style>
    :root {
      --paper: #e8eef4; --card: #f7f4ec; --ink: #1b2430; --mute: #5d6a78;
      --line: #cfd6de; --blue: #2b6cb0; --gold: #b8872a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; background: var(--paper); color: var(--ink);
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden;
    }
    canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
    #stage { position: fixed; inset: 0; perspective: 1100px; z-index: 1; pointer-events: none; }
    #rig {
      position: absolute; left: 50%; top: 46%; width: 0; height: 0;
      transform-style: preserve-3d; transition: transform .7s cubic-bezier(.2,.8,.2,1);
    }
    .page {
      position: absolute; width: min(78vw, 440px); height: min(68vh, 540px);
      left: calc(min(78vw, 440px) / -2); top: calc(min(68vh, 540px) / -2);
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: 0 18px 50px rgba(27,36,48,.18); padding: 14px 14px 12px;
      display: flex; flex-direction: column; gap: 8px; pointer-events: auto; backface-visibility: hidden;
    }
    .page h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
    .page h2 b { color: var(--ink); letter-spacing: 0; text-transform: none; font-size: 18px; margin-left: 8px; }
    .chart { position: relative; flex: 1; min-height: 0; }
    .chart img { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 8px; }
    .hl {
      position: absolute; pointer-events: none; border: 2px solid var(--blue); border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(43,108,176,.18); opacity: 0; transform: scale(.86);
      transition: opacity .18s, transform .18s;
    }
    .hl.on { opacity: 1; transform: scale(1); }
    .tip { min-height: 1.3em; font-size: 13px; color: var(--mute); }
    .tip a { color: var(--blue); text-decoration: none; }
    #dock {
      position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom));
      display: flex; justify-content: center; gap: 8px; z-index: 2;
    }
    #dock button {
      font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--line); background: rgba(247,244,236,.92); color: var(--ink); cursor: pointer;
    }
    #dock button.on { background: var(--ink); color: #f7f4ec; border-color: var(--ink); }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="stage"><div id="rig"></div></div>
  <nav id="dock"></nav>
<script type="module">
const PAGES = [
  { id: 'city', kicker: '0\u00b0', title: 'City', svg: citySvg(), areas: [
    { shape: 'circle', x: 240, y: 118, r: 22, name: 'Cascade', href: 'https://en.wikipedia.org/wiki/Yerevan_Cascade' },
    { shape: 'circle', x: 248, y: 198, r: 24, name: 'Republic Square', href: 'https://en.wikipedia.org/wiki/Republic_Square,_Yerevan' },
    { shape: 'circle', x: 168, y: 168, r: 20, name: 'Tsitsernakaberd', href: 'https://en.wikipedia.org/wiki/Tsitsernakaberd' },
    { shape: 'circle', x: 300, y: 268, r: 22, name: 'Erebuni', href: 'https://en.wikipedia.org/wiki/Erebuni_Fortress' },
  ]},
  { id: 'ridge', kicker: '120\u00b0', title: 'Ridge', svg: ridgeSvg(), areas: [
    { shape: 'circle', x: 210, y: 128, r: 28, name: 'Greater Ararat', href: 'https://en.wikipedia.org/wiki/Mount_Ararat' },
    { shape: 'circle', x: 318, y: 168, r: 22, name: 'Little Ararat', href: 'https://en.wikipedia.org/wiki/Little_Ararat' },
    { shape: 'circle', x: 168, y: 268, r: 20, name: 'Khor Virap', href: 'https://en.wikipedia.org/wiki/Khor_Virap' },
    { shape: 'rect', x: 40, y: 292, w: 400, h: 28, name: 'Araxes', href: 'https://en.wikipedia.org/wiki/Aras_(river)' },
  ]},
  { id: 'road', kicker: '240\u00b0', title: 'Road', svg: roadSvg(), areas: [
    { shape: 'circle', x: 86, y: 210, r: 22, name: 'Istanbul', href: 'https://en.wikipedia.org/wiki/Istanbul' },
    { shape: 'circle', x: 200, y: 168, r: 20, name: 'Kars', href: 'https://en.wikipedia.org/wiki/Kars' },
    { shape: 'circle', x: 292, y: 198, r: 22, name: 'Yerevan', href: 'https://en.wikipedia.org/wiki/Yerevan' },
    { shape: 'circle', x: 384, y: 132, r: 22, name: 'Tbilisi', href: 'https://en.wikipedia.org/wiki/Tbilisi' },
  ]},
];
function citySvg(){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360"><rect width="480" height="360" fill="#f3efe4"/><g fill="none" stroke="#d3cbb8" stroke-width="1"><path d="M40 40H440M40 320H440M40 40V320M440 40V320"/><path d="M40 130H440M40 230H440M160 40V320M320 40V320"/></g><path d="M36 86C92 110 120 168 168 196C228 232 250 250 310 262C360 272 410 250 452 228" fill="none" stroke="#7aa0c4" stroke-width="10" stroke-linecap="round"/><path d="M36 86C92 110 120 168 168 196C228 232 250 250 310 262C360 272 410 250 452 228" fill="none" stroke="#cfe0ee" stroke-width="4"/><rect x="228" y="182" width="40" height="32" fill="#e8d9b0" stroke="#1b2430" stroke-width="1.4"/><path d="M226 180h44M232 174h32M238 168h20M244 162h8" stroke="#1b2430" stroke-width="3" fill="none"/><circle cx="240" cy="118" r="7" fill="#2b6cb0"/><circle cx="248" cy="198" r="7" fill="#2b6cb0"/><circle cx="168" cy="168" r="7" fill="#2b6cb0"/><circle cx="300" cy="268" r="7" fill="#2b6cb0"/><text x="24" y="28" fill="#5d6a78" font-size="11" font-family="system-ui">Yerevan</text></svg>`;}
function ridgeSvg(){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360"><rect width="480" height="360" fill="#eef2f0"/><path d="M0 300 L80 220 L160 268 L210 96 L270 230 L318 148 L380 250 L480 210 L480 360 L0 360Z" fill="#c5d0c6"/><path d="M80 220 L160 268 L210 96 L270 230 L318 148 L380 250" fill="none" stroke="#1b2430" stroke-width="1.6"/><path d="M198 128 L210 96 L226 140" fill="#f7f4ec"/><path d="M0 308 H480" stroke="#7aa0c4" stroke-width="8"/><circle cx="210" cy="128" r="7" fill="#2b6cb0"/><circle cx="318" cy="168" r="7" fill="#2b6cb0"/><circle cx="168" cy="268" r="7" fill="#2b6cb0"/><rect x="160" y="258" width="16" height="14" fill="#7a3b2e"/><text x="24" y="28" fill="#5d6a78" font-size="11" font-family="system-ui">Masis</text></svg>`;}
function roadSvg(){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360"><rect width="480" height="360" fill="#f4efe8"/><path d="M86 210 C140 210 160 168 200 168 C240 168 250 198 292 198 C340 198 350 132 384 132" fill="none" stroke="#d7c39a" stroke-width="10"/><path d="M86 210 C140 210 160 168 200 168 C240 168 250 198 292 198 C340 198 350 132 384 132" fill="none" stroke="#1b2430" stroke-width="1.6" stroke-dasharray="6 7"/><circle cx="86" cy="210" r="7" fill="#2b6cb0"/><circle cx="200" cy="168" r="7" fill="#2b6cb0"/><circle cx="292" cy="198" r="7" fill="#2b6cb0"/><circle cx="384" cy="132" r="7" fill="#2b6cb0"/><text x="24" y="28" fill="#5d6a78" font-size="11" font-family="system-ui">west to east</text></svg>`;}
const MAP_W=480, MAP_H=360;
const rig=document.getElementById('rig'), dock=document.getElementById('dock');
let face=0;
const R=()=>Math.max(220, Math.min(innerWidth, innerHeight)*0.42);
function areaCoords(a){ return a.shape==='circle' ? `${a.x},${a.y},${a.r}` : `${a.x},${a.y},${a.x+a.w},${a.y+a.h}`; }
function build(){
  rig.innerHTML=''; dock.innerHTML='';
  PAGES.forEach((p,i)=>{
    const url=URL.createObjectURL(new Blob([p.svg],{type:'image/svg+xml'}));
    const art=document.createElement('article');
    art.className='page';
    art.style.transform=`rotateY(${i*120}deg) translateZ(${R()}px)`;
    art.innerHTML=`<h2>${p.kicker}<b>${p.title}</b></h2><div class="chart"><img id="img-${p.id}" alt="${p.title} schematic" width="${MAP_W}" height="${MAP_H}" usemap="#${p.id}"><i class="hl" id="hl-${p.id}"></i><map name="${p.id}">${p.areas.map(a=>`<area shape="${a.shape}" coords="${areaCoords(a)}" href="${a.href}" target="_blank" rel="noopener" alt="${a.name}" data-page="${p.id}">`).join('')}</map></div><p class="tip" id="tip-${p.id}">Tap a mark.</p>`;
    rig.append(art); art.querySelector('img').src=url;
    const btn=document.createElement('button'); btn.type='button'; btn.textContent=p.title;
    btn.addEventListener('click',()=>turn(i)); dock.append(btn);
  });
  bindMaps(); turn(face,true);
}
function mapScale(img){ const r=img.getBoundingClientRect(); return {sx:r.width/MAP_W, sy:r.height/MAP_H}; }
function highlight(pageId, area, img){
  const hl=document.getElementById('hl-'+pageId), tip=document.getElementById('tip-'+pageId);
  if(!area){ hl.classList.remove('on'); tip.textContent='Tap a mark.'; return; }
  const {sx,sy}=mapScale(img);
  if(area.shape==='circle'){ const d=area.r*2*Math.max(sx,sy)+10; hl.style.width=hl.style.height=d+'px'; hl.style.left=(area.x*sx-d/2)+'px'; hl.style.top=(area.y*sy-d/2)+'px'; hl.style.borderRadius='50%'; }
  else { hl.style.width=(area.w*sx+8)+'px'; hl.style.height=(area.h*sy+8)+'px'; hl.style.left=(area.x*sx-4)+'px'; hl.style.top=(area.y*sy-4)+'px'; hl.style.borderRadius='8px'; }
  hl.classList.add('on');
  tip.innerHTML=`<a href="${area.href}" target="_blank" rel="noopener">${area.name}</a>`;
}
function bindMaps(){
  PAGES.forEach(p=>{
    const img=document.getElementById('img-'+p.id);
    document.querySelectorAll(`area[data-page="${p.id}"]`).forEach((el,idx)=>{
      const area=p.areas[idx];
      el.addEventListener('mouseenter',()=>highlight(p.id,area,img));
      el.addEventListener('mouseleave',()=>highlight(p.id,null,img));
      el.addEventListener('click',()=>highlight(p.id,area,img));
    });
  });
}
function turn(i, instant){
  face=((i%3)+3)%3;
  if(instant) rig.style.transition='none';
  rig.style.transform=`rotateY(${-face*120}deg)`;
  if(instant) requestAnimationFrame(()=>{ rig.style.transition=''; });
  [...dock.children].forEach((b,n)=>b.classList.toggle('on', n===face));
  if(window.faceUniform) window.faceUniform(face);
}
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='3'||e.key==='d') turn(face+1);
  if(e.key==='ArrowLeft'||e.key==='1'||e.key==='a') turn(face-1);
  if(e.key==='2') turn(1);
});
let px=0, dragging=false;
addEventListener('pointerdown',e=>{ if(e.target.closest('area,a,button')) return; dragging=true; px=e.clientX; });
addEventListener('pointerup',e=>{ if(!dragging) return; dragging=false; const dx=e.clientX-px; if(dx<-40) turn(face+1); else if(dx>40) turn(face-1); });
addEventListener('resize',()=>build());
const canvas=document.getElementById('gl');
const gl=canvas.getContext('webgl2',{alpha:false,antialias:true});
if(gl){
  const vs=`#version 300 es
  const vec2 P[3]=vec2[3](vec2(-1,-1),vec2(3,-1),vec2(-1,3));
  void main(){ gl_Position=vec4(P[gl_VertexID],0.0,1.0); }`;
  const fs=`#version 300 es
  precision highp float;
  uniform vec2 u_res; uniform float u_time; uniform float u_face; out vec4 o;
  void main(){
    vec2 p=(gl_FragCoord.xy-0.5*u_res)/u_res.y;
    float ang=atan(p.x,p.y);
    float sector=floor((ang+3.14159265)/2.09439510);
    float active=1.0-abs(mod(sector-u_face+1.5,3.0)-1.5);
    float rays=0.55+0.45*cos(ang*3.0-u_face*2.09439510);
    float wash=0.5+0.5*sin(u_time*0.35+p.y*3.0+sin(p.x*4.0+u_time*0.6));
    float grain=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453);
    vec3 paper=vec3(0.91,0.93,0.96), blue=vec3(0.17,0.42,0.69), gold=vec3(0.72,0.53,0.16), ink=vec3(0.12,0.18,0.28);
    vec3 c=mix(paper,blue,0.08+0.10*wash);
    c=mix(c,gold,0.04*rays*active);
    c=mix(c,ink,0.06*(1.0-rays));
    c*=0.88+0.12*smoothstep(1.15,0.15,length(p));
    c+=(grain-0.5)*0.03;
    o=vec4(c,1.0);
  }`;
  const compile=(type,src)=>{ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog=gl.createProgram();
  gl.attachShader(prog,compile(gl.VERTEX_SHADER,vs));
  gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  const uRes=gl.getUniformLocation(prog,'u_res'), uTime=gl.getUniformLocation(prog,'u_time'), uFace=gl.getUniformLocation(prog,'u_face');
  let faceVal=0; window.faceUniform=(n)=>{ faceVal=n; };
  const draw=(t)=>{
    const dpr=Math.min(2,devicePixelRatio||1), w=Math.max(1,canvas.clientWidth*dpr), h=Math.max(1,canvas.clientHeight*dpr);
    if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; gl.viewport(0,0,w,h); }
    gl.uniform2f(uRes,w,h); gl.uniform1f(uTime,t*0.001); gl.uniform1f(uFace,faceVal);
    gl.drawArrays(gl.TRIANGLES,0,3); requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
}
build();
</script>
</body>
</html>
